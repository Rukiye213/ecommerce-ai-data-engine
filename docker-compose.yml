services:
  postgres:
    image: postgres:16-alpine
    container_name: ecommerce_postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ecommerce_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ecommerce_network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: ecommerce_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - ecommerce_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ecommerce_backend
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - qdrant
    environment:
      - POSTGRES_HOST=postgres
      - QDRANT_HOST=qdrant
      - OLLAMA_HOST=host.docker.internal
    networks:
      - ecommerce_network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: ecommerce_frontend
    ports:
      - "8501:8501"
    depends_on:
      - backend
    networks:
      - ecommerce_network

networks:
  ecommerce_network:
    driver: bridge

volumes:
  postgres_data:
  qdrant_data: